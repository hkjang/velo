<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Cute bright lime-to-teal gradient for the baby dino -->
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8ff78" />
      <stop offset="100%" stop-color="#78ffd6" />
    </linearGradient>
  </defs>

  <!-- Baby Dinosaur (Velo) Body -->
  <!-- Cute rounded head & back -->
  <path d="M 60,25 
           C 40,25 35,40 35,55 
           C 35,68 45,78 50,85 
           C 52,88 50,95 62,95 
           C 75,95 85,85 85,70 
           C 85,55 80,25 60,25 Z" 
        fill="url(#backGrad)" />

  <!-- Cheek/Snout -->
  <path d="M 35,55 
           C 25,58 22,70 35,72 
           C 42,73 48,70 48,60 Z" 
        fill="url(#backGrad)" />

  <!-- Big Cute Eye -->
  <circle cx="45" cy="48" r="9" fill="#1e293b" />
  <!-- Eye Highlights -->
  <circle cx="42" cy="45" r="3.5" fill="#ffffff" />
  <circle cx="48" cy="51" r="1.5" fill="#ffffff" />

  <!-- Cute Rosy Cheek -->
  <circle cx="38" cy="62" r="5" fill="#ff758c" opacity="0.6" />

  <!-- Happy Smile Line -->
  <path d="M 28,64 Q 33,67 36,63" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

  <!-- Dino Back Spikes (Stylized to look like speed chevrons) -->
  <path d="M 72,27 L 82,23 L 78,35 Z" fill="#3b82f6" />
  <path d="M 80,40 L 90,36 L 86,48 Z" fill="#3b82f6" />
  <path d="M 84,55 L 94,51 L 90,63 Z" fill="#3b82f6" />

  <!-- Tiny Dino Arms holding a lightning bolt -->
  <path d="M 52,72 C 48,72 45,78 50,80 C 53,81 55,75 52,72 Z" fill="#1e293b" />
  <!-- A tiny glowing cyan lightning/energy bolt representing performance/Velo -->
  <path d="M 45,78 L 38,84 L 43,84 L 40,90 L 48,82 L 43,82 Z" fill="#00f2fe" />
</svg>
